name: Deploy Telegram Bot to Google Cloud VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Auto Deploy to GCE VM
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USERNAME }}
          key: ${{ secrets.GCE_SSH_KEY }}
          port: ${{ secrets.GCE_PORT || 22 }}
          script: |
            echo "🚀 Starting automated deployment..."
            cd ~/telegram-sub-bot

            # Take a fresh database backup before pulling/rebuilding, in case this
            # deploy includes a schema migration. Abort the deploy if the backup
            # fails so we never migrate production data without a fresh restore point.
            echo "💾 Backing up database before deploying new version..."
            python3 scripts/backup_db.py || { echo "❌ Backup failed — aborting deploy to avoid migrating without a restore point."; exit 1; }

            # Pull latest changes from main branch
            git reset --hard HEAD
            git pull origin main

            # Regenerate bot/version.json from the commit we just pulled, so
            # /version reflects this deploy instead of whatever was last committed
            # (bot/version.json is gitignored and rebuilt fresh on every deploy).
            python3 scripts/generate_version.py

            # Export environment variables for Docker Compose
            export BOT_APP_VERSION=$(git rev-parse --short HEAD)
            export BOT_APP_DATE=$(git log -1 --format=%cd --date=format:"%Y-%m-%d %H:%M:%S")
            export BOT_APP_MESSAGE=$(git log -1 --format=%s)

            # Rebuild and restart docker containers in background
            docker compose up -d --build
            
            echo "✅ Deployment completed successfully!"
            docker compose ps
