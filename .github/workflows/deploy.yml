name: Deploy Telegram Bot to Google Cloud VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Auto Deploy to GCE VM
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USERNAME }}
          key: ${{ secrets.GCE_SSH_KEY }}
          port: ${{ secrets.GCE_PORT || 22 }}
          script: |
            echo "🚀 Starting automated deployment..."
            cd ~/telegram-sub-bot
            
            # Pull latest changes from main branch
            git pull origin main
            
            # Clean up any zombie standalone python bot processes if any
            pkill -f "python.*bot.main" || true
            pkill -f "python.*bot/main" || true
            
            # Rebuild and restart docker containers in background
            docker compose down || true
            docker compose up -d --build --remove-orphans
            
            echo "✅ Deployment completed successfully!"
            docker compose ps
