name: Deploy Telegram Bot to Google Cloud VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Auto Deploy to GCE VM
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USERNAME }}
          key: ${{ secrets.GCE_SSH_KEY }}
          port: ${{ secrets.GCE_PORT || 22 }}
          script: |
            echo "🚀 Starting automated deployment..."
            cd ~/telegram-sub-bot

            # Pull latest changes from main branch
            git reset --hard HEAD
            git pull origin main

            # Regenerate bot/version.json from the commit we just pulled, so
            # /version reflects this deploy instead of whatever was last committed
            # (bot/version.json is gitignored and rebuilt fresh on every deploy).
            python3 scripts/generate_version.py

            # Ensure SECONDARY_CHANNEL_ID and TERTIARY_CHANNEL_ID are present in .env on server
            if [ -f .env ]; then
              if grep -q "^SECONDARY_CHANNEL_ID=" .env; then
                sed -i 's/^SECONDARY_CHANNEL_ID=.*/SECONDARY_CHANNEL_ID=-1003940881279/' .env
              else
                echo "" >> .env
                echo "SECONDARY_CHANNEL_ID=-1003940881279" >> .env
              fi

              if grep -q "^TERTIARY_CHANNEL_ID=" .env; then
                sed -i 's/^TERTIARY_CHANNEL_ID=.*/TERTIARY_CHANNEL_ID=-1003900142712/' .env
              else
                echo "" >> .env
                echo "TERTIARY_CHANNEL_ID=-1003900142712" >> .env
              fi
            fi

            # Export environment variables for Docker Compose
            export BOT_APP_VERSION=$(git rev-parse --short HEAD)
            export BOT_APP_DATE=$(git log -1 --format=%cd --date=format:"%Y-%m-%d %H:%M:%S")
            export BOT_APP_MESSAGE=$(git log -1 --format=%s)

            # Rebuild and restart docker containers in background
            docker compose up -d --build

            # Clean up dangling images from old builds to prevent disk bloat
            docker image prune -f
            
            echo "✅ Deployment completed successfully!"
            docker compose ps
